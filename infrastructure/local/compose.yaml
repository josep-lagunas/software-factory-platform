# Local-development Docker Compose for SFP infrastructure dependencies.
#
# Scope of this file:
#   - Postgres cluster (SFP-76 / doc SFP-59)
#   - LocalStack — SNS/SQS/DLQ emulation (SFP-77 / doc SFP-60)
# The OpenTelemetry Collector is added by a later ticket per ID-055.
#
# Per ID-055, Compose brings up *dependencies only*; application services run on
# the host via `uv run` (one process per service) for fast reload/debugging.
# Per MAS §10.14, one Postgres cluster hosts multiple logical databases — shared
# infrastructure is permitted, shared *ownership* is not.
#
# Usage:
#   docker compose -f infrastructure/local/compose.yaml up -d
#   docker compose -f infrastructure/local/compose.yaml ps
#   docker compose -f infrastructure/local/compose.yaml down      # keep data
#   docker compose -f infrastructure/local/compose.yaml down -v   # wipe data
#
# Connect from the host (e.g. for psql / Alembic) as the local-dev superuser:
#   psql "host=localhost port=5432 user=sfp password=sfp_local_dev dbname=identity"
#
# Reach LocalStack from the host (e.g. for AWS CLI / boto3 under `uv run`):
#   export AWS_ENDPOINT_URL=http://localhost:4566
#
# All values below are overridable from a local .env file or the shell; the
# defaults keep `docker compose up` zero-config for local development.

services:
  postgres:
    image: postgres:16-alpine
    container_name: sfp-postgres
    restart: unless-stopped
    environment:
      # Cluster superuser + default maintenance DB. The four service logical
      # databases (identity, orchestrator, communication, external_events) are
      # created at first startup by postgres/init.sh, mounted below.
      POSTGRES_USER: ${POSTGRES_USER:-sfp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sfp_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Logical-DB provisioning; the entrypoint runs /docker-entrypoint-initdb.d
      # scripts once, against an empty data volume, as the superuser.
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      # Named volume so data survives `down`; use `down -v` to wipe and reprovision.
      - sfp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `$$` is escaped so Compose does not interpolate it; the container shell
      # expands $POSTGRES_USER / $POSTGRES_DB from the env above.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  localstack:
    image: localstack/localstack
    container_name: sfp-localstack
    restart: unless-stopped
    environment:
      # Comma-separated list of emulated AWS services. SFP-77 covers SNS + SQS;
      # the DLQ pattern is an SQS queue with a redrive policy, NOT a separate
      # service. Per ID-054, Secrets Manager is intentionally NOT emulated here.
      SERVICES: ${LOCALSTACK_SERVICES:-sns,sqs}
      # Persist emulated state into the named volume below so `down` (without
      # -v) keeps topics/queues for fast local-dev iteration.
      DATA_DIR: /var/lib/localstack
      # AWS_ENDPOINT_URL is a *client-side* setting (not consumed by LocalStack
      # itself); it is documented here for discoverability. Other Compose
      # services reach LocalStack at http://localstack:4566 via service-name
      # DNS; host-side consumers (the app under `uv run`) use
      # http://localhost:4566 — see the export line in the file header.
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      # Named volume so emulated topics/queues survive `down`; use `down -v` to
      # wipe. State is written here because DATA_DIR points at the same path.
      - sfp-localstack-data:/var/lib/localstack
    healthcheck:
      # `localstack wait` blocks until the emulated services report ready.
      test: ["CMD", "localstack", "wait"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  sfp-postgres-data:
  sfp-localstack-data:
