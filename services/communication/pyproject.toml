[project]
name = "communication"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "httpx",
    "sfp-config",
    "sfp-contracts",
    "sfp-messaging",
    "uvicorn>=0.52.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# sfp-config is a workspace member (packages/sfp-config); resolve it from the
# local workspace rather than a registry (SFP-75 precedent). The Slack
# outbound adapter (SFP-133) resolves SecretRef(name="SLACK_BOT_TOKEN")
# through the injected SecretProvider (ID-016) and drives chat.postMessage
# with httpx (ID-051). SFP-132 adds the inbound half: the Slack Events
# receiver publishes ExternalEventReceived envelopes (sfp-contracts) onto the
# MessageBus (sfp-messaging), and the dev runner serves it via uvicorn.
[tool.uv.sources]
sfp-config = { workspace = true }
sfp-contracts = { workspace = true }
sfp-messaging = { workspace = true }

[tool.coverage.run]
source = ["src/communication"]

[tool.coverage.report]
fail_under = 90
