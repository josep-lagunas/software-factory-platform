[project]
name = "external-events"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "communication",
    "httpx",
    "sfp-config",
    "sfp-contracts",
    "sfp-messaging",
    "uvicorn>=0.52.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
# sfp-config: the SFP-86 SecretProvider seam + SecretRef are the auth
# factory's runtime imports (SFP-122). SFP-124 adds the publisher:
# ExternalEventReceived / EventEnvelope (sfp-contracts) are its runtime
# imports, and it types its bus seam against the MessageBus Protocol
# (sfp-messaging, TYPE_CHECKING-only at runtime). SFP-132 adds the minimal
# dev webhook runner (entrypoints/dev_webhook.py), served via uvicorn — the
# same dependency the communication dev runner declared before the drift
# removal.
sfp-config = { workspace = true }
sfp-contracts = { workspace = true }
sfp-messaging = { workspace = true }
# SFP-257 (Phase-A dev glue): the dev composition entrypoint
# (entrypoints/dev_composition.py) imports the landed Communication components
# in-process — a dev monolith convenience, NOT a MAS boundary change (MAS §9.4
# is the reference sequence). httpx is the dev GLM AgentRuntime adapter's
# transport (the same ID-051 choice as the Slack outbound adapter).
communication = { workspace = true }

[tool.coverage.run]
source = ["src/external_events"]

[tool.coverage.report]
fail_under = 90
