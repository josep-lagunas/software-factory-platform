[project]
name = "orchestrator"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0.0",
    "sfp-contracts",
    "sfp-messaging",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Workspace members resolved locally, never from a registry (SFP-75 precedent).
# sfp-contracts: WorkflowUpdated event + envelopes (SFP-137 publishing wrapper).
# sfp-messaging: the MessageBus interface seam (DOC#42; in-memory transport
# today per the software-first owner decision, SFP-101 re-plumbs later).
[tool.uv.sources]
sfp-contracts = { workspace = true }
sfp-messaging = { workspace = true }

[tool.coverage.run]
omit = ['*/migrations/env.py']
source = ["src/orchestrator"]

[tool.coverage.report]
fail_under = 90
